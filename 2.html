<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Program - 3</title>

    <style>
        p {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <p id="demo">TEXT GROWING</p>

    <script>
        var font_size = 5;
        var p = document.getElementById("demo");
        var grow;
        var shrink;

        grow = setInterval(growing, 1000);

        function growing() {
            font_size = font_size + 5;

            p.innerHTML = "TEXT GROWING";
            p.style.fontSize = font_size + "px";
            p.style.color = "red";

            if (font_size >= 50) {
                clearInterval(grow);
                shrink = setInterval(shrinking, 1000);
            }
        }

        function shrinking() {
            font_size = font_size - 5;

            p.innerHTML = "TEXT SHRINKING";
            p.style.fontSize = font_size + "px";
            p.style.color = "blue";

            if (font_size <= 5) {
                clearInterval(shrink);
                grow = setInterval(growing, 1000);
            }
        }
    </script>

</body>
</html>
